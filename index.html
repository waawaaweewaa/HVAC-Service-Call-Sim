<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2b705">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HVAC Sim">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>HVAC Service Call Sim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: field-service tablet. Scene viewport on the left, yellow meter + work order rail on the right; stacks on phones. */
:root{
  --bg:#e8ecef;--panel:#ffffff;--panel2:#f3f5f7;--ink:#16202a;--muted:#5a6773;--line:#cfd6dc;--sline:#56616b;
  --accent:#f2b705;--accent-ink:#1d1704;--copper:#b5652a;--cold:#2a78b5;--hot:#c4432b;--ok:#2c8a55;--warn:#a87300;
  --sky:#dce8f0;--grass:#a9c48f;--wall:#efe4cd;--wall2:#e2d3b3;--roof:#6d5245;--attic:#eadcbb;--metal:#d3d9de;--metal2:#a3aeb7;--dark:#2a3239;
  --duct:#bcd7ea;--pcb:#3f7a52;--lcd:#c3d4a8;--lcd-ink:#1b2416;--frost:#ffffff;--water:#5aa3d6;--dirt:#8a6a45;--filter:#f4f1e6;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  /* real-world wire insulation colors: identical in both themes */
  --w-blk:#151515;--w-red:#c0392b;--w-yel:#e2b100;--w-blu:#2f6fb5;--w-wht:#f1f1f1;--w-grn:#2e8b57;--w-brn:#7a4b25;--w-pur:#7b54a8;--lead-red:#e03b2b;--lead-blk:#111111;--rust:#9c4a1f;--oil:#2e2516;--scorch:#1d140c;--sweat:#6aa8d8;--warmair:#e0883a;--tepid:#8fb3cf;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161b;--panel:#1a2128;--panel2:#212a32;--ink:#e4eaef;--muted:#93a0ab;--line:#2d3842;--sline:#9aa6b0;
  --accent:#f2b705;--accent-ink:#1d1704;--copper:#d0844a;--cold:#5aa6dd;--hot:#e2654d;--ok:#4fbf80;--warn:#e0a52a;
  --sky:#1d2a35;--grass:#2f4127;--wall:#3a3428;--wall2:#2f2a20;--roof:#4a362d;--attic:#3b3325;--metal:#6f7a83;--metal2:#4f5a63;--dark:#0d1114;
  --duct:#3d5c72;--pcb:#2f5e3e;--lcd:#9fb685;--lcd-ink:#121a0e;--frost:#e8f4ff;--water:#3d86bd;--dirt:#7a5c3a;--filter:#cfc9b6;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161b;--panel:#1a2128;--panel2:#212a32;--ink:#e4eaef;--muted:#93a0ab;--line:#2d3842;--sline:#9aa6b0;
  --accent:#f2b705;--accent-ink:#1d1704;--copper:#d0844a;--cold:#5aa6dd;--hot:#e2654d;--ok:#4fbf80;--warn:#e0a52a;
  --sky:#1d2a35;--grass:#2f4127;--wall:#3a3428;--wall2:#2f2a20;--roof:#4a362d;--attic:#3b3325;--metal:#6f7a83;--metal2:#4f5a63;--dark:#0d1114;
  --duct:#3d5c72;--pcb:#2f5e3e;--lcd:#9fb685;--lcd-ink:#121a0e;--frost:#e8f4ff;--water:#3d86bd;--dirt:#7a5c3a;--filter:#cfc9b6;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0}
button{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:6px 14px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.brand h1{font:700 28px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin:0;text-wrap:balance}
.brand h1 b{background:var(--accent);color:var(--accent-ink);padding:0 6px;border-radius:3px}
.meta{font:500 12px var(--f-mono);color:var(--muted)}
.ver{font:600 12px var(--f-mono);letter-spacing:0;text-transform:none;color:var(--muted);vertical-align:super;margin-left:5px;line-height:0}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:4px;border:1px solid var(--line);background:var(--panel)}
.chip.tier{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--panel))}
.spacer{flex:1}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 12px;font-weight:600;font-size:14px;line-height:1.2}
.btn:hover{border-color:var(--sline)}
.btn:focus-visible,.cmp:focus-visible,.hot:focus-visible,.mode:focus-visible,.zc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{border-color:var(--hot);color:var(--hot)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(330px,1fr);gap:16px;align-items:start}
@media (max-width:920px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.scenewrap{overflow:hidden}
.crumb{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crumb .where{font:600 16px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
html{touch-action:manipulation}
#scene{touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#scene.zoomed{touch-action:none;cursor:grab}
#scene.zoomed:active{cursor:grabbing}
#scene svg{display:block;width:100%;height:auto;max-width:100%}
.egg.vreset{left:auto;right:8px;width:auto;padding:0 10px;border-radius:999px;font:700 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.zones{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line)}
.zc{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 11px;font:600 13px var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.zc[aria-current="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.complist{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 12px}
.complist button{cursor:pointer;border:1px dashed var(--sline);background:transparent;border-radius:6px;padding:4px 9px;font-size:13px}
.complist button[aria-pressed="true"]{border-style:solid;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.rail{display:flex;flex-direction:column;gap:14px;min-width:0}
/* the meter: the one loud object on the page */
.meter{background:var(--accent);border-radius:16px;padding:12px;color:var(--accent-ink);box-shadow:inset 0 0 0 3px rgba(0,0,0,.18)}
.meter .lcdbox{background:var(--lcd);color:var(--lcd-ink);border-radius:8px;padding:10px 12px;box-shadow:inset 0 2px 6px rgba(0,0,0,.35);min-height:96px;display:flex;flex-direction:column;justify-content:center}
.meter .read{font:600 34px/1.05 var(--f-mono);font-variant-numeric:tabular-nums;word-break:break-word}
.meter .read small{font-size:16px;margin-left:6px}
.meter .read.multi{font-size:19px}
.meter .pt{font:500 12px var(--f-mono);opacity:.85;margin-top:4px}
.meter .mnote{font-size:13px;margin-top:8px;line-height:1.4}
.modes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:10px}
.mode{cursor:pointer;border:0;border-radius:999px;background:var(--dark);color:#e9eef2;font:600 13px var(--f-mono);padding:8px 0}
.mode[aria-pressed="true"]{background:#fff;color:#111;box-shadow:0 0 0 2px var(--dark)}
.mlabel{display:flex;justify-content:space-between;font:700 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.sect{padding:14px}
.sect h2{font:700 18px var(--f-display);letter-spacing:.05em;text-transform:uppercase;margin:0 0 6px}
.obs{background:var(--panel2);border-left:3px solid var(--sline);padding:8px 10px;border-radius:4px;font-size:14px;margin:6px 0 10px;white-space:pre-line}
.lab{font:700 11px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.probe{cursor:pointer;display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 10px;font-size:14px;margin-bottom:6px}
.probe:hover{border-color:var(--accent)}
.probe .dot{width:10px;height:10px;border-radius:50%;background:var(--hot);flex:none;box-shadow:12px 0 0 var(--dark)}
.probe .dot+span{margin-left:12px}
.event{border-radius:6px;padding:8px 10px;margin-top:10px;font-size:14px;background:color-mix(in srgb,var(--accent) 20%,var(--panel));border:1px solid var(--accent)}
.event.bad{background:color-mix(in srgb,var(--hot) 14%,var(--panel));border-color:var(--hot)}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{cursor:pointer;flex:1;border:0;background:transparent;padding:10px 8px;font:700 14px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.wo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px}
.wo dt{font:600 12px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.wo dd{margin:0}
.quote{font-size:15px;border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:8px 0 12px;font-style:italic}
.qa{margin:8px 0 0;font-size:14px}
.qa b{display:block}
.log{list-style:none;margin:0;padding:0;font:13px/1.45 var(--f-mono);max-height:340px;overflow:auto}
.log li{padding:5px 0;border-bottom:1px dashed var(--line)}
.log li.bad{color:var(--hot)}
.log li.hl{background:color-mix(in srgb,var(--accent) 28%,transparent);border-radius:4px;padding-left:4px;padding-right:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;width:min(520px,calc(100vw - 32px));background:var(--ink);color:var(--panel);border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:14px}
.toast b{font:700 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.toast span{flex:1 1 100%;font:13px/1.4 var(--f-mono);min-width:0;overflow-wrap:anywhere}
.toast .btn{background:transparent;color:var(--panel);border-color:color-mix(in srgb,var(--panel) 40%,transparent)}
.log .n{color:var(--muted);margin-right:6px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;min-width:0}
.field input,.field select{font:15px var(--f-mono);padding:7px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);min-width:0;width:100%}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.callbar{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.callbar .btn.primary{flex:1;font:700 18px var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
/* overlay */
.ov{position:fixed;inset:0;background:rgba(10,14,18,.55);display:flex;align-items:flex-start;justify-content:center;z-index:30;overflow:auto;padding-top:max(24px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.dlg{background:var(--panel);border-radius:12px;border:1px solid var(--line);width:min(760px,100%);padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.dlg h2{font:700 26px/1.1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin:0 0 4px;text-wrap:balance}
.dlg h3{font:700 16px var(--f-display);letter-spacing:.08em;text-transform:uppercase;margin:18px 0 6px}
.opts{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.opts label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;font-size:14px}
.opts label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.scores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
@media (max-width:560px){.scores{grid-template-columns:repeat(2,minmax(0,1fr))}}
.score{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel2)}
.score .v{font:700 40px/1 var(--f-display);font-variant-numeric:tabular-nums}
.score .v small{font-size:16px;color:var(--muted)}
.score .k{font:600 11px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.score.rank .v{font-size:26px;line-height:1.5}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font:600 12px var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.chain span{padding:4px 7px;border-radius:4px;background:var(--panel2);border:1px solid var(--line)}
.chain span.hit{background:var(--hot);color:#fff;border-color:var(--hot)}
.chain i{color:var(--muted);font-style:normal}
ul.chk{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
ul.chk li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px}
.y{color:var(--ok);font-weight:700}.n{color:var(--hot);font-weight:700}
ol.exp{margin:0;padding-left:22px;font-size:14px;display:flex;flex-direction:column;gap:4px}
table.hist{width:100%;border-collapse:collapse;font-size:13px}
table.hist th,table.hist td{text-align:left;padding:6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
/* svg */
.st{stroke:var(--sline);stroke-width:1.2}
.k-sky{fill:var(--sky)}.k-grass{fill:var(--grass)}.k-wall{fill:var(--wall)}.k-wall2{fill:var(--wall2)}.k-roof{fill:var(--roof)}.k-attic{fill:var(--attic)}
.k-metal{fill:var(--metal)}.k-metal2{fill:var(--metal2)}.k-dark{fill:var(--dark)}.k-panel{fill:var(--panel)}.k-lcd{fill:var(--lcd)}.k-pcb{fill:var(--pcb)}
.k-duct{fill:var(--duct)}.k-water{fill:var(--water)}.k-acc{fill:var(--accent)}.k-hot{fill:var(--hot)}.k-copper{fill:var(--copper)}.k-dirt{fill:var(--dirt)}.k-frost{fill:var(--frost)}
.f-clean{fill:var(--filter)}.f-dirty{fill:#b9a27c}.f-clogged{fill:#6b5a46}
.pipe{fill:none;stroke:var(--metal2);stroke-width:4;stroke-linecap:round}
.ls-s{fill:none;stroke:var(--dark);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.ls-l{fill:none;stroke:var(--copper);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.frostline{fill:none;stroke:var(--frost);stroke-width:3;stroke-dasharray:2 3;stroke-linecap:round}
.wire{fill:none;stroke-width:2.4;stroke-linecap:round}
.fin{stroke:var(--metal2);stroke-width:1}
.lbl{font:600 10.5px var(--f-display);letter-spacing:.1em;fill:var(--ink);text-transform:uppercase}
.lbl2{font:600 13px var(--f-display);letter-spacing:.1em;fill:var(--ink);text-transform:uppercase}
.tiny{font:500 9px var(--f-mono);fill:var(--ink)}
.leader{stroke:var(--ink);stroke-width:.8;fill:none}
.lcdbig{font:600 42px var(--f-mono);fill:var(--lcd-ink)}
.lcdsm{font:600 12px var(--f-mono);fill:var(--lcd-ink)}
.air{fill:none;stroke:var(--cold);stroke-width:2;stroke-dasharray:5 5;stroke-linecap:round}
.air.hot{stroke:var(--hot)}.air.weak{opacity:.45}
.duct-o{fill:none;stroke:var(--sline);stroke-width:19;stroke-linejoin:miter}.duct-i{fill:none;stroke:var(--duct);stroke-width:16;stroke-linejoin:miter}
.duct-flow{fill:none;stroke:var(--cold);stroke-width:3;stroke-dasharray:6 4;opacity:.6}.duct-flow.warm{stroke:var(--muted)}
.air.warm{stroke:var(--muted)}
@keyframes flow{to{stroke-dashoffset:-20}}
.spin{animation:spin .45s linear infinite;transform-origin:0 0}
.spin-s{animation:spin 1.1s linear infinite;transform-origin:0 0}
@keyframes spin{to{transform:rotate(360deg)}}
.buzz{animation:buzz .08s linear infinite}
@keyframes buzz{50%{transform:translateY(.8px)}}
.hot{cursor:pointer}
.hot rect{fill:transparent;stroke:var(--sline);stroke-width:1;stroke-dasharray:3 4;opacity:.55}
.hot:hover rect,.hot:focus rect{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:6 3;opacity:1}
.cmp{cursor:pointer;outline:none}
.cmp .hit{fill:transparent;stroke:transparent;stroke-width:2.2}
.cmp:hover .hit,.cmp:focus .hit{stroke:var(--accent);stroke-dasharray:6 3}
.cmp.sel .hit{stroke:var(--accent);stroke-dasharray:none;stroke-width:3}
.wr{fill:none;stroke-linecap:round;stroke-linejoin:round}
.tsm{font:600 12px var(--f-display);letter-spacing:.06em;fill:var(--ink);text-transform:uppercase;paint-order:stroke;stroke:var(--panel);stroke-width:3px}
.tsm.inv{fill:#eef2f4;stroke:none}
.tlab{font:700 14px var(--f-display);letter-spacing:.05em;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.term{cursor:pointer;outline:none}
.term .thit{fill:transparent;stroke:transparent;stroke-width:2.5}
.term:hover .thit,.term:focus .thit{fill:color-mix(in srgb,var(--accent) 30%,transparent);stroke:var(--accent)}
.screw{fill:var(--metal);stroke:var(--sline);stroke-width:1.5}
.slot{stroke:var(--sline);stroke-width:2.5}
.ldline{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:8 6}
.lead-r{fill:none;stroke:var(--lead-red);stroke-width:5}
.lead-b{fill:none;stroke:var(--lead-blk);stroke-width:5}
.lead-halo{fill:none;stroke:#ffffff;stroke-width:9;opacity:.8}
.ltag{font:700 11px var(--f-mono);fill:#fff}
.cuhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.leadchip{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--f-mono);padding:4px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel2)}
.leadchip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.scenebox{position:relative}
.egg{position:absolute;top:8px;left:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);opacity:.5;cursor:pointer;display:grid;place-items:center;padding:0}
.egg:hover,.egg:focus-visible,.egg[aria-pressed="true"]{opacity:1;color:var(--cold);border-color:var(--cold)}
.qbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel2)}
.qbar .btn{min-height:40px}
.qbar .ql{font:700 11px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.qmsg{flex-basis:100%;font-size:13px;color:var(--muted)}.qmsg.bad{color:var(--hot)}
#world{transform-origin:0 0}

/* ---------- landscape phones: 50/50 split, each half scrolls on its own ---------- */
@media (orientation:landscape) and (max-height:540px){
  .wrap{padding-block:4px 4px}
  header.top{padding-block:2px 6px;gap:6px 10px;flex-wrap:nowrap}
  .brand h1{font-size:19px;white-space:nowrap}
  .brand .meta{display:none}
  .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:stretch}

  makeHouse(R,avoid){

  geom(s){

  base(R,avoid){

const GEN_SEQ='On a call for cooling the thermostat connects R to Y (compressor) and R to G (indoor blower). 24 V starts at the transformer secondary, passes the board fuse, goes through the thermostat, through any safeties in the Y line (float switch, pressure switches), energizes the contactor coil, and returns on C. The contactor closes and sends 240 V to the compressor and condenser fan; each motor uses its run capacitor to start and run. The blower pushes house air across the evaporator, the refrigerant absorbs that heat, and the condenser dumps it outside.';

  keyWhy:['Prove the condenser has no line voltage, then find out why.','Check windings to ground BEFORE resetting. Resetting into a grounded compressor is dangerous and just trips it again.','After the reset, compare compressor amps to RLA so you know it is not about to trip again.'],
  partial:['coil_open','contactor_pitted'],
  expert:['Verify the complaint: indoor blower runs, condenser silent. The problem is on the condenser\'s line-voltage side or in the Y circuit.','Measure the disconnect line side: 0 V. The contactor is even pulled in, so the 24 V side works.','Go to the panel: the AC breaker handle sits in the tripped (middle) position.','Before resetting: pull the disconnect and check the compressor and fan to ground. OL means no grounded winding.','Reset the breaker (firmly OFF, then ON), restore power, check compressor amps against RLA and the temperature split.','Tell the customer a storm surge is the likely trigger, and recommend a surge protector if it happens again.'],
  seq:'With the breaker tripped, the 24 V side still works. The thermostat calls, the blower runs on G, and Y reaches the contactor coil (it pulls in). There is simply no 240 V on the contactor\'s line side to pass along.'},
 {id:'stat_batt',tier:1,sys:['split-ac'],cat:'controls',node:[4],code:'NO COOL',label:'Dead thermostat batteries (no C wire)',repair:'Replace thermostat batteries and recommend adding a C wire',
  apply(s){s.stat.cWire=false;s.stat.batt=false},
  complaint:['The thermostat screen is blank and nothing is running.','Nothing comes on. The thermostat on the wall is just a blank screen.'],
  ans:{when:"Yesterday evening, I think. Didn't notice until the house got warm.",recent:"Nothing. We haven't touched anything.",noise:"Nothing's running, so no.",tried:'I flipped the furnace switch off and on.'},
  key:['i:tstat_t','f_rc@V'],
  keyWhy:['Pull the thermostat off the wall and look: no C wire means it runs on batteries.','Prove 24 V is available at the board, so the power supply is not the problem.'],
  partial:['fuse_swap','xfmr_open','fuse_chafe'],
  expert:['Verify: blank thermostat, no blower, no condenser.','Ask the key question: is this thermostat powered by batteries or by 24 V? Pull the faceplate: no C wire.','Remove the blower door, tape the door switch, and measure board R–C: 24 V is there. The problem is local to the thermostat.','Replace the batteries, set COOL below room temperature, and confirm the blower and condenser start.','Recommend running a C wire so dead batteries can\'t shut the system down again.'],
  seq:'A battery-only thermostat has no C wire. Its screen and its switching logic run on AA batteries; R is just the 24 V hot it hands back out on Y and G. Dead batteries mean no display and no call, even though the 24 V system is healthy.'},
 {id:'float_clog',tier:1,sys:['split-ac'],cat:'controls',node:[5],code:'POOR COOL',label:'Clogged condensate drain tripped the float switch',repair:'Clear and flush the drain, reset the float switch',
  apply(s){s.indoor.drainClogged=true},
  complaint:["The fan blows but the air isn't cold.","Air is coming out of the vents, but it's room temperature."],
  ans:{when:'Started this morning.',recent:'Nothing new.',noise:'The outside unit is quiet.',water:"Now that you mention it, there's water in the pan under the furnace. Is that normal?",tried:'Turned it off and on a couple times.'},
  key:[['i:float','f_float'],['c_coil@V','f_yc@V']],
  keyWhy:['Find the open safety: pan full, float lifted.','Trace Y: 24 V at the board but 0 V at the contactor puts the break between them.'],
  partial:['coil_open','contactor_pitted','breaker_trip'],
  expert:['Verify: blower runs, condenser off. Suspect the Y circuit or condenser power.','Measure Y–C at the board: 24 V. Measure at the contactor coil: 0 V. The break is between the furnace and the condenser.','Follow the Y wire: it runs through the float switch on the secondary pan. The pan is full and the float is lifted.','Confirm with the meter: 24 V across the float switch. An open switch drops full voltage.','Clear the primary drain (wet-vac or flush), clean the trap, empty the pan, confirm the float drops and the condenser starts.','Root cause: algae slime in the drain. Recommend drain tablets or an annual flush.'],
  seq:'The float switch is a safety wired in series with Y. When condensate backs up and lifts the float, Y opens so the system stops making water. The blower keeps running because G is not interrupted.'},
 {id:'fuse_swap',tier:1,sys:['split-ac'],cat:'electrical',node:[3],code:'NO COOL',label:'Blown 3 A board fuse (shorted during a thermostat install)',repair:'Replace the 3 A fuse and correct the thermostat wiring',
  apply(s,R){s.indoor.fuseOK=false;s.stat.cWire=true;s.indoor.fuseVisible=R.chance(.5)},
  complaint:["I put in a new Wi-Fi thermostat yesterday and now it's blank. Nothing runs.","The thermostat went blank yesterday and nothing works now."],
  ans:{when:'Yesterday afternoon.',recent:"I swapped the old thermostat for a smart one. I didn't shut the power off... there was a little spark when two wires touched.",noise:'Nothing is running.',tried:'I checked the breakers. They all look fine.'},
  key:['f_fuse',['f_xs@V','f_rc@V']],
  keyWhy:['Measure across the fuse (24 V = open) or read it with power off (OL).','Prove the transformer makes 24 V, so the break is after it.'],
  partial:['fuse_chafe','xfmr_open','stat_batt'],
  expert:['Verify: blank thermostat, nothing runs. Ask about recent work: the thermostat swap is your biggest clue.','Remove the blower door and tape the door switch. 120 V on the transformer primary and 24 V on the secondary: the transformer is good.','Board R–C reads 0 V, so something between the transformer and the R terminal is open. Measure across the fuse: 24 V. It is open.','Power off, confirm the fuse reads OL, replace it with the same 3 A rating.','Check the thermostat wiring for a loose strand touching R and C; tighten and re-test. Teach the customer to kill power before touching thermostat wires.'],
  seq:'R from the transformer passes through the 3 A board fuse before it reaches the thermostat. Touching R to C during the install shorted the secondary; the fuse opened to save the transformer. No R means no thermostat power and no calls.'},
 {id:'filter_clog',tier:1,sys:['split-ac'],cat:'airflow',node:[11],code:'LOW AIRFLOW',label:'Clogged filter, iced evaporator coil',repair:'Replace filter, thaw the coil, then verify split and pressures',
  apply(s){s.indoor.filter='clogged'},
  complaint:["Barely any air is coming out of the vents and it isn't cooling.","Weak air from the vents, and I saw ice on the pipe outside."],
  ans:{when:"It's been getting worse all week.",recent:"Nothing new. We've been meaning to get it serviced.",noise:'Nothing unusual.',water:'Some water dripping in the furnace closet.',tried:'Nothing yet.'},
  key:['i:filter',['r_sup@T','r_ret@T'],['i:coil','i:ports']],
  keyWhy:['On any airflow complaint, check the filter first.','Measure the split to see what the coil is doing.','Look for ice. You can\'t judge the charge with an iced coil.'],
  partial:['blower_cap','charge_low'],
  expert:['Verify: weak airflow at the registers.','Check the filter first on any airflow complaint: fully loaded.','Inspect the evaporator: iced. Suction line frosted back to the condenser.','Do NOT read the charge with an iced coil. The numbers mean nothing until it thaws.','Replace the filter, run fan-only until the coil is fully thawed, then verify the split and pressures.','Teach the customer a filter schedule.'],
  seq:'Low indoor airflow means too little heat reaches the evaporator. Suction pressure drops, the coil goes below 32°F, condensate freezes, and the ice blocks even more air. Low suction with LOW superheat points to airflow; low suction with HIGH superheat points to charge or a restriction.'},
 {id:'xfmr_open',tier:2,sys:['split-ac'],cat:'electrical',node:[2],code:'NO COOL',label:'Open control transformer',repair:'Replace the transformer (matching VA)',
  apply(s,R){s.indoor.xfmrOK=false;s.stat.cWire=true;s.indoor.xfmrSmell=R.chance(.5)},
  complaint:["The thermostat is dead and nothing runs.","No display on the thermostat, no air, nothing."],
  ans:{when:'This morning.',recent:'No work done. We lost power for a second yesterday.',noise:'I smelled something kind of electrical in the closet yesterday.',tried:'Changed the thermostat batteries. Nothing.'},
  key:['f_xp@V','f_xs@V'],
  keyWhy:['120 V on the primary proves power reaches the transformer.','0 V on the secondary with 120 V in = open transformer.'],
  partial:['fuse_swap','stat_batt','fuse_chafe'],
  expert:['Verify: blank thermostat, nothing runs.','At the furnace: 120 V at the junction box. Line voltage is fine.','Blower door off, door switch taped: 120 V on the transformer primary, 0 V on the secondary. The transformer is open.','Power off: primary reads OL, which confirms an open winding.','Before installing the new one, make sure no low-voltage short killed it. The fuse is intact, so age or a surge is more likely.','Replace with the same VA rating, restore power, verify 24 V and a normal cooling call.'],
  seq:'The transformer steps 120 V down to 24 V for the whole control circuit. With an open winding there is no R, so no thermostat power and no calls, even though line voltage to the furnace is fine.'},
 {id:'coil_open',tier:2,sys:['split-ac'],cat:'electrical',node:[6],code:'NO COOL',label:'Open contactor coil',repair:'Replace the contactor',
  apply(s){s.outdoor.coilOK=false},
  complaint:["Air blows inside, but the outside unit won't start.","Warm air. The outside unit just sits there."],
  ans:{when:'Two days ago.',recent:'Nothing new.',noise:'Dead quiet outside.',tried:'Reset the thermostat.'},
  key:[['c_dload@V','c_line@V'],'c_coil@V','c_coil@R'],
  keyWhy:['Confirm 240 V is available to the contactor.','24 V at the coil proves the call arrives.','With power off and a coil wire lifted, OL proves an open coil.'],
  partial:['contactor_pitted','float_clog','breaker_trip'],
  expert:['Verify: blower runs, condenser silent.','Line voltage at the disconnect and the contactor line side: 240 V. High voltage is available.','24 V at the contactor coil: the call is reaching the condenser.','Plunger not pulled in with 24 V applied: the coil is suspect.','Power off, lift a coil wire, measure the coil: OL. Open coil.','Replace the contactor; inspect contacts and wiring; verify operation and amps.'],
  seq:'The contactor is a relay. Its 24 V coil creates a magnetic field that pulls the contacts closed and sends 240 V to the compressor and fan. Voltage at the coil plus no pull-in means an open coil.'},
 {id:'contactor_pitted',tier:2,sys:['split-ac'],cat:'electrical',node:[7],code:'NO COOL',label:'Burned / pitted contactor contacts',repair:'Replace the contactor',
  apply(s,R){s.outdoor.pitted=true;s.outdoor.pitScorch=R.chance(.6)},
  complaint:['The outside unit buzzes, but nothing spins.',"There's a buzzing sound out there but the fan never turns."],
  ans:{when:'Since yesterday.',recent:'Nothing.',noise:'A steady buzz from the outside unit.',tried:'Turned it off for an hour and back on.'},
  key:['c_coil@V',['c_pole1@V','c_load@V']],
  keyWhy:['24 V at the coil with the plunger in: the control side works.','Line voltage across a pulled-in pole (or 0 V on the load side) proves the contact is open.'],
  partial:['coil_open','cap_fan','cap_herm'],
  expert:['Verify: blower runs, condenser buzzing, nothing spinning.','24 V at the coil and the plunger is pulled in. The control side is fine.','Line side 240 V. Load side T1–T2 about 0 V. Power is not getting through.','Measure across each pole: about 240 V across L1–T1. That contact is burned open.','Pull the disconnect and replace the contactor. Check compressor and fan amps afterward: burned contacts often come from high amp draw or short cycling.'],
  seq:'When the contactor pulls in, each pole should act as a closed switch with almost no voltage across it. A pole that reads full line voltage while pulled in is open, and the motors only get one leg.'},
 {id:'cap_fan',tier:2,sys:['split-ac'],cat:'electrical',node:[8,9],code:'POOR COOL',label:'Weak condenser fan capacitor',repair:'Replace the run capacitor',
  apply(s,R){s.outdoor.fanUF=s.outdoor.fanRated*R.range(.12,.45);s.outdoor.bulge=R.chance(.5)},
  complaint:["The outside unit is running, but the fan on top isn't spinning.","Air is kind of cool but not cold. The outside unit sounds weird."],
  ans:{when:'Today.',recent:'Nothing.',noise:'Humming outside, louder than normal.',tried:'Nothing.'},
  key:['c_fan@C',['c_fan_a@A','i:fan']],
  keyWhy:['Discharged cap reading far below its rating confirms it.','Hum without rotation, at high amps, is the classic weak-cap symptom.'],
  partial:['cap_herm','coil_dirty'],
  expert:['Verify: compressor running, condenser fan humming but not turning. Head pressure is climbing.','Shut it down quickly: high head plus a hot compressor.','Pull the disconnect, discharge the cap, measure FAN–C: far below rating.','Spin the blade by hand: it turns freely, so the bearings are fine and the cap is the cause.','Replace with the same µF and equal or higher voltage rating. Verify fan amps against FLA and normal head pressure.'],
  seq:'A PSC fan motor needs its run capacitor to create the phase shift that gets it turning. With a weak cap the motor hums and won\'t self-start, but it runs if you push it. With no condenser airflow, head pressure and compressor amps climb fast.'},
 {id:'cap_herm',tier:2,sys:['split-ac'],cat:'electrical',node:[8,9],code:'NO COOL',label:'Weak compressor (HERM) run capacitor',repair:'Replace the run capacitor',
  apply(s,R){s.outdoor.hermUF=s.outdoor.hermRated*R.range(.35,.7);s.outdoor.compHot=true;s.outdoor.bulge=R.chance(.5)},
  complaint:["The fan outside runs, but the air inside isn't cold. Every few minutes there's a loud hum outside.","The outside fan is going but no cold air. I hear a hum, then a click."],
  ans:{when:'Yesterday afternoon, during the heat.',recent:'Nothing.',noise:'A loud hum outside, then a click, every few minutes.',tried:'Nothing.'},
  key:['c_comp_a@A','c_herm@C'],
  keyWhy:['The amp pattern (0 A, then near-LRA hum and a trip) shows a no-start.','HERM–C far below rating is the cause.'],
  partial:['cap_fan','contactor_pitted'],
  expert:['Verify: condenser fan running, compressor off, shell hot.','Clamp the compressor common: 0 A now. When the overload resets it tries, pulls near-LRA amps, hums, trips. That is a no-start.','Hot compressor with C–R and C–S open but R–S intact means an open internal overload, not a dead compressor.','Pull the disconnect, discharge, measure HERM–C: well below rating.','Replace the cap, cool the shell so the overload resets, then verify starting and running amps below RLA.'],
  seq:'The run capacitor feeds the compressor\'s start winding out of phase so the motor gets starting torque. A weak cap gives too little torque: the motor locks, draws near-LRA current, overheats, and the internal overload opens. It repeats every few minutes.'},
 {id:'blower_cap',tier:2,sys:['split-ac'],cat:'airflow',node:[10],code:'NO AIRFLOW',label:'Failed blower motor capacitor',repair:'Replace the blower capacitor and thaw the coil',
  apply(s,R){s.indoor.bCapUF=s.indoor.bCapRated*R.range(.1,.4);s.indoor.bulge=R.chance(.5)},
  complaint:["No air is coming out of the vents at all, but the outside unit is running.","The outside unit runs but nothing comes out of the vents."],
  ans:{when:'This afternoon.',recent:'Nothing.',noise:'A hum from the furnace closet.',water:'A little water on the closet floor.',tried:'Changed the filter. No difference.'},
  key:['f_bm@V','f_bcap@C'],
  keyWhy:['120 V at the motor leads proves the board is calling the blower.','The capacitor reading far below rating is the cause.'],
  partial:['filter_clog','xfmr_open'],
  expert:['Verify: no airflow at the registers while the condenser runs. Shut cooling off before the coil freezes solid.','At the furnace: the board is calling (G) and there is 120 V at the blower leads.','The motor hums, does not turn, housing hot. The wheel spins freely by hand, so it is not seized.','Power off, discharge, measure the blower cap: far below rating.','Replace the cap, thaw the coil, verify blower amps against FLA and the temperature split.'],
  seq:'On a cooling call the board sends 120 V to the blower\'s cooling speed tap. A PSC blower motor depends on its run capacitor to start. Without airflow the evaporator freezes, so a blower failure often shows up first as ice.'},
 {id:'coil_dirty',tier:3,sys:['split-ac'],cat:'refrigeration',node:[12],code:'POOR COOL',label:'Dirty condenser coil (high head pressure)',repair:'Clean the condenser coil and re-check pressures and amps',
  apply(s){s.outdoor.coil='dirty'},
  complaint:['It runs all day and the house never gets below 77.','It runs and runs. The electric bill is way up.'],
  ans:{when:'A few weeks now, getting worse.',recent:"Nothing. There's a big cottonwood out back that's been shedding like crazy.",noise:'Seems louder than it used to be.',tried:'Changed the filter last month.'},
  key:['i:ccoil','c_liq@P','c_liq@T'],
  keyWhy:['Look at the condenser coil before you hook up gauges.','High head pressure confirms the coil can\'t reject heat.','Liquid line temperature gives subcooling: near target means the charge is fine.'],
  partial:['charge_over','cap_fan'],
  expert:['Verify: long runtime, weak split.','Inspect before hooking up gauges: the condenser coil is matted with debris.','Gauges: head pressure high (condensing temperature well above ambient + 20°F). Subcooling near target, so the charge is OK. The coil can\'t reject heat.','Compressor amps elevated against RLA.','Clean the coil (power off, rinse from the inside out), then re-check: head and amps drop toward normal.','Do NOT recover refrigerant to "fix" high head here. That is the overcharge mistake.'],
  seq:'The condenser rejects heat into outdoor air. Block that airflow and the refrigerant has to get hotter (higher pressure) before it can shed the same heat. High head with normal subcooling = condenser airflow problem. High head with high subcooling = overcharge.'},
 {id:'charge_low',tier:3,sys:['split-ac'],cat:'refrigeration',node:[13],code:'POOR COOL',label:'Low refrigerant charge (leak)',repair:'Leak search and repair, evacuate, weigh in the charge',
  apply(s,R){s.ref.charge='low';s.ref.oilAt=R.chance(.6)?R.pick(['valve','coil']):null},
  complaint:["It runs constantly and it isn't as cold as it used to be.","Not cooling great. A guy topped it off with Freon last summer."],
  ans:{when:'Gradually, over the last month.',recent:'Nothing new.',noise:'No.',tried:'Someone added refrigerant last summer. It worked fine for a while.'},
  key:['i:plate','c_suct@P','c_suct@T','c_liq@P','c_liq@T'],
  keyWhy:['Read the data plate for refrigerant type and target subcooling before using a PT chart.','Suction pressure → saturation temperature.','Suction line temperature → superheat.','Liquid pressure → condensing temperature.','Liquid line temperature → subcooling.'],
  partial:['filter_clog'],
  expert:['Verify: long runtime, split low (about 10–12°F).','Check the filter and indoor airflow first. Low suction can be an airflow problem.','Read the data plate: refrigerant type and target subcooling (TXV system).','Gauges and line temps: low suction, HIGH superheat, LOW subcooling. The evaporator is starving from low charge.','Low charge = leak, and "topped off last year" confirms it. Leak search, repair, pressure test, evacuate to 500 microns, weigh in the charge, verify subcooling.'],
  seq:'A TXV holds superheat steady until it runs out of liquid to feed. With low charge it opens all the way and still can\'t fill the coil: superheat rises, subcooling drops, and both suction and head pressure fall.'},
 {id:'charge_over',tier:3,sys:['split-ac'],cat:'refrigeration',node:[13],code:'POOR COOL',label:'Refrigerant overcharge',repair:'Recover refrigerant to the target subcooling',
  apply(s){s.ref.charge='over'},
  complaint:["Ever since another company serviced it in the spring, it's louder and doesn't cool as well.","It doesn't keep up. Somebody charged it up a few months ago."],
  ans:{when:'Since spring.',recent:'Another company did a tune-up and said it needed refrigerant.',noise:'Louder outside than it used to be.',tried:'Nothing.'},
  key:['i:plate','c_liq@P','c_liq@T','c_suct@P','c_suct@T'],
  keyWhy:['Get the refrigerant and target subcooling from the data plate.','Liquid pressure → condensing temperature.','Liquid line temperature → subcooling (high).','Suction pressure → saturation.','Suction line temperature → superheat.'],
  partial:['coil_dirty'],
  expert:['Verify: weak cooling. Look at the condenser coil first to rule out an airflow cause: it is clean.','Read the data plate: refrigerant type and target subcooling.','Gauges: high head, HIGH subcooling (liquid stacking in the condenser), superheat low to normal.','Compressor amps above normal.','Recover refrigerant until subcooling reaches the target; re-check superheat and amps.'],
  seq:'Extra refrigerant stacks up as liquid in the condenser. That leaves less coil surface for condensing, so head pressure rises and subcooling climbs well past the target.'},
 {id:'fuse_chafe',tier:3,sys:['split-ac'],cat:'electrical',node:[3,14],code:'NO COOL · CALLBACK',label:'Repeat blown fuse: chafed Y wire shorting at the condenser',repair:'Repair the chafed wire, add a grommet, replace the fuse',
  apply(s,R){s.indoor.fuseOK=false;s.outdoor.yShort=true;s.stat.cWire=true;s.outdoor.yScorch=R.chance(.5)},
  complaint:['The thermostat went blank again. Second time this month. The last company just replaced a fuse.','It quits every time it starts cooling. The other tech said it was a fuse.'],
  ans:{when:'Again this morning.',recent:'Another company replaced a little fuse two weeks ago. It worked for a day.',noise:'No.',tried:'Called the other company. They never came back.'},
  key:['f_fuse',['c_ywire@R','i:lvwire']],
  keyWhy:['Confirm the fuse is open.','Find WHY: the Y conductor touching the cabinet is a dead short to ground.'],
  partial:['fuse_swap'],
  expert:['Verify: blank thermostat. History: a fuse was replaced recently. A fuse that blows twice is a symptom, not the cause.','Confirm the blown fuse (24 V across it, or OL with power off).','Before replacing it, hunt the short. It blows on a cooling call, so suspect the Y circuit.','At the condenser: the Y conductor is rubbed through on the cabinet edge. Lift the wire: Y to ground reads near 0 Ω.','Repair the wire, add a grommet or reroute, replace the fuse, run a full cooling call and confirm it holds.'],
  seq:'When the thermostat closes R–Y, current flows down Y to the contactor coil. If bare Y copper touches the grounded cabinet, that path bypasses the coil entirely. That is a dead short, and the 3 A fuse opens instantly.'}
,
 {id:'lug_burnt',tier:3,sys:['split-ac'],cat:'electrical',node:[7,9],code:'BURNING SMELL',label:'Loose / burnt connection at contactor T1 (voltage drop under load)',repair:'Cut back and re-terminate the burnt wire, replace the contactor, verify voltage drop under load',
  apply(s,R){s.outdoor.lugBurnt=true;s.outdoor.lugVisible=R.chance(.6)},
  complaint:["There's a burning plastic smell by the outside unit when the AC runs.","The AC runs, but there's a hot electrical smell outside and the lights flicker when it kicks on."],
  ans:{when:'Noticed the smell a few days ago.',recent:'Nothing new.',noise:'Sometimes a faint sizzle from the outside unit while it runs.',tried:"Nothing. I didn't want to touch it."},
  key:['c_lugdrop@V',['c_compV@V','c_comp_a@A']],
  keyWhy:['Measure across the connection WHILE it runs. A good joint drops almost nothing; several volts means a high-resistance joint turning current into heat.','Confirm the effect at the motor: lower voltage at the compressor (or slightly high amps) shows the loss is between the contactor and the compressor.'],
  partial:['contactor_pitted','cap_herm'],
  expert:['Verify: it cools, but there is a burning smell at the condenser. Treat a burning smell as urgent.','With it running, compare voltage at the contactor line side (about 240 V) to voltage at the compressor C–R. A few volts lower points to a drop somewhere between them.','Measure across each connection under load. T1 lug to the T1 wire end reads several volts. A good connection reads well under 1 V.','Clamp the compressor: amps run slightly high on the reduced voltage. The real danger is the heat at the joint, not the amp draw.','Kill power and inspect. The T1 lug and wire end are heat-damaged. Sometimes it looks fine until you pull the wire, which is why the meter test comes first.','Cut the wire back to clean copper, install a new terminal, replace the contactor (its lug is heat-damaged), torque it, then re-check the drop under load.'],
  seq:'A loose or corroded joint has resistance. With current flowing, that resistance drops voltage and turns it into heat (I²R). Heat oxidizes the joint, which raises the resistance further, until the insulation melts or the wire burns off. With no current flowing, the same joint reads 0 V across it and looks fine, so it has to be tested under load.'}
];

 {id:'h_rattle',sys:['split-ac'],ex:['cap_fan'],apply:s=>{s.outdoor.rattle=true},ans:{noise:'The outside unit has been rattling for a while.'},comp:'fan'},

 {id:'h_lugtint',sys:['split-ac'],ex:['lug_burnt'],apply:s=>{s.outdoor.lugTint=true},comp:'contactor'},

const WHY={
 f_rc:['Why check R–C at the board?','To prove the 24 V control circuit is powered before blaming anything downstream',['To test the thermostat batteries','To see if the compressor is grounded']],
 t_ry:['Why measure across R–Y at the thermostat?','About 0 V means the switch is closed and passing the call; 24 V means it is open',['It shows outdoor line voltage','It measures the thermostat\'s current draw']],
 f_fuse:['Why measure voltage ACROSS the fuse?','A good fuse drops about 0 V; full voltage across it means it is open',['A healthy fuse should read 24 V across it','It tells you the transformer VA rating']],
 f_xs:['Why measure the transformer secondary?','To prove the transformer is turning 120 V into 24 V',['To find the blower speed','To check the refrigerant charge']],
 f_xp:['Why check the transformer primary?','To confirm 120 V reaches the transformer, so a dead secondary points at the transformer itself',['To check gas pressure','To measure airflow']],
 c_coil:['Why check voltage at the contactor coil?','It proves whether the Y call is actually reaching the condenser',['It shows whether the run capacitor is weak','It measures compressor amps']],
 c_pole1:['Why measure across a pole while the contactor is pulled in?','A healthy closed contact drops almost nothing; high voltage across it means burned, open contacts',['It gives coil resistance','It discharges the capacitor']],
 c_herm:['Why read µF on HERM–C?','A weak run cap starves the compressor of starting torque: it hums, locks and trips',['µF tells you the line voltage','It confirms the refrigerant type']],
 c_fan:['Why read µF on FAN–C?','A weak cap leaves the PSC fan unable to start on its own, so head pressure climbs',['It measures airflow in CFM','It sets the fan speed']],
 f_bcap:['Why read the blower capacitor?','A PSC blower motor can\'t start without a healthy run capacitor',['It sets the cooling speed tap','It measures static pressure']],
 c_wCR:['Why read compressor winding resistance?','C–R plus C–S should equal R–S; OL on C–R and C–S with R–S intact means a hot, open internal overload',['To measure superheat','To identify the thermostat wire colors']],
 c_comp_g:['Why check the compressor terminals to ground?','A winding shorted to the shell will trip the breaker again; never reset into a dead short',['To set the TXV','To read the fan capacitor']],
 c_comp_a:['Why clamp the compressor common?','Comparing amps to RLA and LRA tells you whether the motor is running, struggling, or failing to start',['To measure voltage drop','To read subcooling']],
 c_suct:['Why read suction pressure AND line temperature?','Pressure gives saturation temperature; line temp minus saturation = superheat',['Pressure alone tells you the charge','Line temperature alone gives subcooling']],
 c_liq:['Why read liquid pressure AND line temperature?','Condensing (saturation) temp minus liquid line temp = subcooling, the charge check for a TXV system',['It measures superheat','It shows compressor amps']],
 r_sup:['Why measure supply and return temperatures?','The temperature split shows whether the coil is removing heat (typically about 16–22°F)',['It calibrates the thermostat','It shows line voltage']],
 f_float:['Why check across the float switch?','An open safety in the Y circuit drops the full 24 V across itself and blocks the call',['It measures condensate flow','It shows blower amps']],
 c_ywire:['Why check the Y wire to ground at the condenser?','A Y conductor touching the cabinet shorts the 24 V circuit and blows the board fuse on every call',['To test the capacitor','To measure line voltage']],
 c_lugdrop:['Why measure across a connection while the system runs?','Current through a loose, burnt joint creates a voltage drop. With no current flowing, a bad joint reads 0 V and looks fine',['It measures the capacitor','It checks the thermostat call']],
 c_dload:['Why check the disconnect load side?','It confirms 240 V gets past the disconnect to the contactor',['It identifies the refrigerant','It measures µF']]
};

/* ---------- generation: seeded, weighted away from recent calls ---------- */
const PEOPLE={first:['Dana','Rick','Priya','Luis','Janet','Tom','Keisha','Walt','Maria','Greg','Nadia','Ed','Carmen','Hal'],last:['Kowalski','Brennan','Ortiz','Nguyen','Patel','Russo','Dube','Hale','Lindqvist','Moreau','Okafor','Shea','Barros','Tran'],
  street:['Birch Hill Rd','Quarry St','Old Colony Rd','Ridgewood Dr','Mill Pond Ln','Juniper Ct','Valley View Rd','Orchard St'],home:['1960s ranch','split-level','Cape Cod','two-story colonial','raised ranch'],
  note:['Dog in the house. Knock and wait.','Elderly occupant. Priority call.','Customer works from home; side door.','Park in the street, not the driveway.','Second call this summer for this address.'],
  svc:['Never, per customer','About 2 years ago','Last spring','Unknown']};
const ENGINE={
  generate(seed,tierIdx,store){
    const R=makeRng(seed),sysId='split-ac',sys=SYSTEMS[sysId],hist0=store.history||[],s=sys.base(R,(hist0[hist0.length-1]||{}).layout);
    const hist=store.history||[],recent=hist.slice(-6).map(h=>h.fault).reverse(),seen=new Set(hist.map(h=>h.fault));
    let pool=FAULTS.filter(f=>f.sys.includes(sysId)&&(tierIdx===3?f.tier>=2:f.tier===tierIdx+1));
    let ws=pool.map(f=>{let w=seen.has(f.id)?1:1.6;const i=recent.indexOf(f.id);if(i===0)w=0;else if(i>0&&i<3)w*=.25;else if(i>=3)w*=.6;return w});
    if(!ws.some(w=>w>0))ws=pool.map(()=>1);
    const fault=R.weighted(pool,ws);fault.apply(s,R);
    let latent=null;
    if(tierIdx===3){const ok=LATENT.filter(l=>l.sys.includes(sysId)&&!l.ex.includes(fault.id));latent=R.pick(ok);latent.apply(s,R)}
    const lastH=new Set((hist[hist.length-1]||{}).herrings||[]);
    const nH=[R.int(0,1),1,R.int(1,2),2][tierIdx];
    let hp=R.shuffle(HERRINGS.filter(h=>h.sys.includes(sysId)&&!h.ex.includes(fault.id)&&!lastH.has(h.id)));
    const herrings=hp.slice(0,nH);herrings.forEach(h=>h.apply&&h.apply(s,R));
    const answers={when:'A couple of days ago, I think.',recent:'Nothing new that I know of.',noise:'Not that I noticed.',water:"No water that I've seen.",tried:'Just messed with the thermostat.',...fault.ans};
    herrings.forEach(h=>{if(h.ans)for(const k in h.ans)answers[k]=(fault.ans&&fault.ans[k]?fault.ans[k]+' ':'')+h.ans[k]});
    let complaint=R.pick(fault.complaint);herrings.forEach(h=>{if(h.say)complaint+=' '+h.say});
    const lastName=(hist[hist.length-1]||{}).cust;let cust;do{cust=R.pick(PEOPLE.first)+' '+R.pick(PEOPLE.last)}while(cust===lastName&&R.f()<.95);
    const meta={wo:'WO-'+(10000+seed%90000),cust,addr:R.int(12,488)+' '+R.pick(PEOPLE.street),home:LAYOUTS[s.house.type].n,note:R.pick(PEOPLE.note),svc:R.pick(PEOPLE.svc)};
    const g={room:0,seed,tierIdx,st:s,fault,latent,herrings,meta,complaint,answers,asked:{},log:[],tests:new Set(),inspected:new Set(),order:[],testCount:0,wrongMode:0,violations:[],unneeded:[],why:[],whyAsked:new Set(),resetNoCheck:false,ptWrongRef:false,shWork:null,done:false};
    G=g;sys.settle(s,[]);
    return g;
  },
  has(t){if(t.startsWith('i:'))return G.inspected.has(t.slice(2));return G.tests.has(t)},
  grade(sel){
    const f=G.fault,L=G.latent,S=SYS();
    const keyHits=f.key.map(k=>(Array.isArray(k)?k:[k]).some(x=>ENGINE.has(x)));
    const keyRatio=keyHits.filter(Boolean).length/keyHits.length;
    const correct=sel.diag===f.id,partial=!correct&&(f.partial||[]).includes(sel.diag);
    const repairOK=sel.repair===f.repair;
    let D=correct?7:partial?4:(FAULT_BY[sel.diag]&&FAULT_BY[sel.diag].cat===f.cat?1.5:.5);
    if(repairOK)D+=2;
    const falseFind=sel.findings.filter(x=>!L||x!==L.id).length,latentFound=!!(L&&sel.findings.includes(L.id));
    if(L){if(latentFound)D+=1}else if(!falseFind)D+=1;
    D-=falseFind*.5;
    const unproven=correct&&keyRatio<.34;if(unproven)D=Math.min(D,5);
    D=clamp(D,0,10);
    let T=10;T-=2.5*G.violations.length;T-=.75*Math.min(G.wrongMode,4);T-=1.5*G.unneeded.length;if(G.resetNoCheck)T-=1.5;if(G.ptWrongRef)T-=1;
    const whyWrong=G.why.filter(w=>!w.ok).length;T-=whyWrong;if(G.shWork)T+=G.shWork.ok?.5:-1;
    T=clamp(T,0,10);
    const eff=Math.min(1,(f.expert.length+3)/Math.max(G.testCount,1));
    const early=G.order.slice(0,4);const verified=early.some(t=>['i:tstat','i:sup','i:ret','r_sup','r_ret','i:cab','i:fan'].includes(t));
    let TS=6*keyRatio+3*eff+(verified?1:0);if(!correct)TS=Math.min(TS,6);TS=clamp(TS,0,10);
    const sc=[D,T,TS].map(x=>Math.max(1,Math.round(x)));let overall=(D+T+TS)/3;if(!correct)overall=Math.min(overall,5.4);
    const rank=overall<4?'Apprentice':overall<6.5?'Junior Tech':overall<8.5?'Service Tech':'Senior Tech';
    const d=S.derive(G.st);
    return{D:sc[0],T:sc[1],TS:sc[2],overall,rank,keyHits,keyRatio,correct,partial,repairOK,latentFound,falseFind,unproven,whyWrong,eff,verified,restored:d.restored};
  }
};

function addLog(t,bad){G.log.push({n:G.log.length+1,t,bad:!!bad})}

function logOnce(key,text,bad,sig){

  if(prev&&prev.sig===s){showDup(prev.n);return false}

/* ---------- interactions ---------- */

function maybeWhy(pid){
  const w=WHY[pid];if(!w||G.whyAsked.has(pid)||G.whyAsked.size>=3)return;

}

      out.innerHTML=`<div class="event${ok?'':' bad'}">${ok?'Math checks out.':'Off.'} Actual superheat ${fx(tsh)}°F, subcooling ${fx(tsc)}°F.${ok?'':' Check you used the right refrigerant, dew for suction and bubble for liquid.'} Target subcooling is on the data plate.</div>`};
  }
}

/* ---------- overlays ---------- */
function showOv(html){$('#ov').innerHTML=`<div class="ov">${html}</div>`;const f=$('#ov').querySelector('button,input,select');f&&f.focus()}
function closeOv(){$('#ov').innerHTML=''}
function openCall(){
  const fl=FAULTS.filter(f=>f.sys.includes(G.st.sys));
  const R=makeRng(hashStr(G.seed+'opts'));const diag=R.shuffle(fl);const reps=R.shuffle([...new Set(fl.map(f=>f.repair))]);
  showOv(`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="ch"><h2 id="ch">Call it</h2><p class="muted small" style="margin:0">Commit to a diagnosis. You'll be graded on whether your readings proved it.</p>
  <h3>Diagnosis</h3><label class="field"><select id="cDiag"><option value="">Choose…</option>${diag.map(f=>`<option value="${f.id}">${esc(f.label)}</option>`).join('')}</select></label>
  <h3>Repair</h3><label class="field"><select id="cRep"><option value="">Choose…</option>${reps.map(r=>`<option>${esc(r)}</option>`).join('')}</select></label>
  <h3>Other problems found (optional)</h3><div class="opts">${LATENT.filter(l=>l.sys.includes(G.st.sys)).map(l=>`<label><input type="checkbox" value="${l.id}"> <span>${esc(l.label)}</span></label>`).join('')}</div>
  <div class="btnrow" style="margin-top:14px"><button class="btn primary" type="button" id="cGo">Submit and debrief</button><button class="btn" type="button" id="cX">Keep troubleshooting</button></div><div id="cErr"></div></div>`);
  $('#cX').onclick=closeOv;
  $('#cGo').onclick=()=>{const diag=$('#cDiag').value,repair=$('#cRep').value;if(!diag||!repair){$('#cErr').innerHTML='<div class="event bad">Pick a diagnosis and a repair.</div>';return}
    const findings=[...document.querySelectorAll('#ov input[type=checkbox]:checked')].map(x=>x.value);debrief({diag,repair,findings})};
}
function debrief(sel){
  const g=ENGINE.grade(sel),f=G.fault,L=G.latent;
  if(!G.done){G.done=true;
    store.history.push({fault:f.id,tier:G.tierIdx,D:g.D,T:g.T,TS:g.TS,o:+g.overall.toFixed(2),rank:g.rank,date:new Date().toISOString().slice(0,10),herrings:G.herrings.map(h=>h.id),cust:G.meta.cust,seed:G.seed,layout:G.st.house.type});
    store.history=store.history.slice(-60);store.callNo++;store.since=(store.since||0)+1;
    let tierMsg='';
    if(store.mode==='auto'){const last=store.history.slice(-3).map(h=>h.o),avg=last.reduce((a,b)=>a+b,0)/last.length;
      if(store.since>=3&&last.length>=3&&avg>=8&&store.tierIdx<3){store.tierIdx++;store.since=0;tierMsg=`Promoted to ${TIERS[store.tierIdx].n}. Calls get harder.`}
      else if(store.since>=2&&avg<4.5&&store.tierIdx>0){store.tierIdx--;store.since=0;tierMsg=`Back to ${TIERS[store.tierIdx].n} for a few calls.`}}
    G.tierMsg=tierMsg;save();}
  const nodes=new Set(f.node);
  const chain=CHAIN.map((c,i)=>`<span class="${nodes.has(i)?'hit':''}">${esc(c)}</span>`).join('<i>›</i>');
  const keys=f.key.map((k,i)=>{const lbl=(Array.isArray(k)?k:[k]).map(x=>x.startsWith('i:')?'inspect '+(SYS().comps[x.slice(2)]||{n:x}).n:(SYS().points[x.split('@')[0]].l+(x.includes('@')?' ['+MODE_N[x.split('@')[1]]+']':''))).join(' or ');
    return `<li><span class="${g.keyHits[i]?'y':'n'}">${g.keyHits[i]?'✓':'✗'}</span><span><b>${esc(lbl)}</b><br><span class="muted">${esc(f.keyWhy[i]||'')}</span></span></li>`}).join('');
  const issues=[];
  G.violations.forEach(v=>issues.push(['n','Safety: '+v]));
  if(G.wrongMode)issues.push(['n',`${G.wrongMode} reading${G.wrongMode>1?'s':''} taken with the wrong meter function.`]);
  G.unneeded.forEach(u=>issues.push(['n',`Unneeded part or repair: ${u}. On a real call that is a cost to the customer and a callback risk.`]));
  if(G.resetNoCheck)issues.push(['n','Reset a tripped breaker without first checking the compressor for a short to ground.']);
  if(G.ptWrongRef)issues.push(['n',`Used the wrong refrigerant's PT chart at least once. This system runs ${G.st.ref.type}; the data plate says so.`]);
  if(g.whyWrong)issues.push(['n',`${g.whyWrong} justification${g.whyWrong>1?'s':''} missed.`]);
  if(G.shWork)issues.push([G.shWork.ok?'y':'n',G.shWork.ok?'Superheat/subcooling math was correct.':'Superheat/subcooling math was off.']);
  if(g.unproven)issues.push(['n','Right answer, but your readings never proved it. On a real call, an unproven guess is a parts-cannon waiting to happen.']);
  if(!g.verified)issues.push(['n','You didn\'t verify the complaint first (thermostat, registers, or a look at the equipment running).']);else issues.push(['y','Verified the complaint early.']);
  if(g.eff<.6)issues.push(['n',`Took ${G.testCount} readings. An experienced tech gets there in about ${f.expert.length+2}. Test with a reason.`]);
  G.herrings.forEach(h=>{if(h.comp&&G.inspected.has(h.comp))issues.push(['y',`Checked the ${SYS().comps[h.comp].n.toLowerCase()} and didn't get distracted by it. That was a red herring.`])});
  if(L)issues.push([g.latentFound?'y':'n',`Secondary defect: ${L.label}. ${g.latentFound?'You caught it.':'You missed it.'}`]);
  if(g.falseFind)issues.push(['n',`${g.falseFind} secondary finding${g.falseFind>1?'s':''} reported that weren't there.`]);
  const yourDiag=FAULT_BY[sel.diag];
  showOv(`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dh"><h2 id="dh">Debrief · ${esc(G.meta.wo)}</h2><p class="muted small" style="margin:0">${esc(TIERS[G.tierIdx].n)} call · ${esc(G.st.equip.brand)} ${G.st.outdoor.tons}-ton · ${esc(G.st.ref.type)}</p>
  <div class="scores"><div class="score"><div class="k">Diagnostic</div><div class="v">${g.D}<small>/10</small></div></div><div class="score"><div class="k">Technical accuracy</div><div class="v">${g.T}<small>/10</small></div></div><div class="score"><div class="k">Troubleshooting</div><div class="v">${g.TS}<small>/10</small></div></div><div class="score rank"><div class="k">Rating</div><div class="v">${esc(g.rank)}</div></div></div>
  ${G.tierMsg?`<div class="event">${esc(G.tierMsg)}</div>`:''}
  <h3>What was wrong</h3><p style="margin:0 0 6px"><b>${esc(f.label)}.</b> ${esc(f.repair)}.</p><div class="chain">${chain}</div>
  <h3>Your call</h3><ul class="chk"><li><span class="${g.correct?'y':'n'}">${g.correct?'✓':'✗'}</span><span>Diagnosis: ${esc(yourDiag?yourDiag.label:'—')}${g.partial?' (related, but not the root problem)':''}</span></li><li><span class="${g.repairOK?'y':'n'}">${g.repairOK?'✓':'✗'}</span><span>Repair: ${esc(sel.repair)}</span></li><li><span class="${g.restored?'y':'n'}">${g.restored?'✓':'–'}</span><span>${g.restored?'System left running and cooling.':'System not restored in the sim (fine for refrigerant repairs, which are recorded on the work order).'}</span></li></ul>
  <h3>Proof readings</h3><ul class="chk">${keys}</ul>
  <h3>Critique</h3><ul class="chk">${issues.map(([c,t])=>`<li><span class="${c}">${c==='y'?'✓':'✗'}</span><span>${esc(t)}</span></li>`).join('')}</ul>
  <h3>How a senior tech runs this call</h3><ol class="exp">${f.expert.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
  <h3>Sequence of operation</h3><p class="small" style="margin:0 0 6px">${esc(GEN_SEQ)}</p><p class="small" style="margin:0"><b>Where it broke:</b> ${esc(f.seq)}</p>
  <div class="btnrow" style="margin-top:16px"><button class="btn primary" type="button" id="dNext">Next service call</button><button class="btn" type="button" id="dStay">Back to the job site</button></div></div>`);
  $('#dNext').onclick=()=>newCall();$('#dStay').onclick=closeOv;
}
function openStats(){
  const h=store.history.slice().reverse().slice(0,15);const avg=k=>h.length?(h.reduce((a,x)=>a+x[k],0)/h.length).toFixed(1):'—';
  showOv(`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="sh"><h2 id="sh">Record &amp; settings</h2>
  <div class="scores"><div class="score"><div class="k">Calls run</div><div class="v">${store.history.length}</div></div><div class="score"><div class="k">Avg diagnostic</div><div class="v">${avg('D')}</div></div><div class="score"><div class="k">Avg technical</div><div class="v">${avg('T')}</div></div><div class="score"><div class="k">Avg troubleshooting</div><div class="v">${avg('TS')}</div></div></div>
  <h3>Difficulty</h3><label class="field"><select id="sMode"><option value="auto"${store.mode==='auto'?' selected':''}>Auto — promote on a 3-call average of 8+ (now ${TIERS[store.tierIdx].n})</option>${TIERS.map(t=>`<option value="${t.id}"${store.mode===t.id?' selected':''}>${t.n} only</option>`).join('')}</select></label><p class="small muted">Applies from the next call.</p>
  <h3>Replay a call</h3><div class="frow"><label class="field">Seed (hex, from the header)<input id="sSeed" placeholder="e.g. 3F2A91C"></label><label class="field">&nbsp;<button class="btn" type="button" id="sReplay">Load seed</button></label></div>
  <h3>Recent calls</h3><div class="tablewrap"><table class="hist"><thead><tr><th>Date</th><th>Problem</th><th>Tier</th><th>D</th><th>T</th><th>TS</th><th>Rating</th></tr></thead><tbody>${h.map(x=>`<tr><td>${x.date}</td><td>${esc((FAULT_BY[x.fault]||{label:x.fault}).label)}</td><td>${TIERS[x.tier].n}</td><td>${x.D}</td><td>${x.T}</td><td>${x.TS}</td><td>${esc(x.rank)}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">No calls finished yet. Your record is saved in this browser only.</td></tr>'}</tbody></table></div>
  <div class="btnrow" style="margin-top:14px"><button class="btn" type="button" id="sClose">Done</button><button class="btn danger" type="button" id="sReset">Reset record</button></div></div>`);
  $('#sMode').onchange=e=>{store.mode=e.target.value;save();renderHeader()};
  $('#sClose').onclick=closeOv;
  $('#sReplay').onclick=()=>{const v=parseInt($('#sSeed').value.trim(),16);if(isFinite(v))newCall(v)};
  $('#sReset').onclick=e=>{const b=e.target;if(!b.dataset.arm){b.dataset.arm='1';b.textContent='Tap again to erase everything';return}store={history:[],mode:'auto',tierIdx:0,since:0,callNo:1};save();closeOv();newCall()};
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-zone],[data-go],[data-comp],[data-probe],[data-act],[data-mode],[data-tab],[data-ask],[data-term],[data-cu],[data-clear],[data-room],[data-showlog]');if(!t)return;
  if(t.dataset.showlog){const n=+t.dataset.showlog;UI.tab='log';UI.hl=n;$('#toast').hidden=true;renderTab();const li=document.querySelector(`.log li[data-ln="${n}"]`);if(li){li.scrollIntoView({block:'nearest'});$('#tabs').scrollIntoView({block:'nearest',behavior:'smooth'})}setTimeout(()=>{if(UI.hl===n){UI.hl=null;if(UI.tab==='log')renderTab()}},4000);return}
  if(t.dataset.term)return tapTerm(t.dataset.term);
  if(t.dataset.cu)return openCu(t.dataset.cu);
  if(t.dataset.clear){UI.leads=[];UI.place=null;renderScene();renderCard();return}
  if(t.dataset.zone)return goZone(t.dataset.zone,t.dataset.room);
  if(t.dataset.room!=null){G.room=+t.dataset.room;UI.comp=null;UI.msg=null;renderAll();return}
  if(t.dataset.go)return goZone(t.dataset.go);
  if(t.dataset.comp)return selectComp(t.dataset.comp);
  if(t.dataset.probe)return probe(t.dataset.probe);
  if(t.dataset.act)return act(t.dataset.act);
  if(t.dataset.mode){UI.mode=t.dataset.mode;UI.leads=[];if(UI.cu){UI.place=null;renderScene()}renderMeter();renderCard();return}
  if(t.dataset.tab){UI.tab=t.dataset.tab;renderTab();return}
  if(t.dataset.ask){const k=t.dataset.ask;G.asked[k]=true;G.order.push('q:'+k);addLog(`Asked: ${QS.find(q=>q[0]===k)[1]}`);renderTab();return}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('g[data-zone],g[data-comp],g[data-term]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
  if(e.key==='Escape'&&$('#ov').innerHTML&&!$('#whyGo'))closeOv();
});
$('#bBack').onclick=()=>{if(UI.cu){UI.cu=null;UI.leads=[];UI.place=null;UI.msg=null;renderAll();return}UI.zone='house';UI.comp=null;UI.msg=null;renderAll()};
$('#bNew').onclick=()=>newCall();

/* ---------- scene-only zoom & pan: pinch, double-tap empty scenery, drag when zoomed ---------- */
const VIEW={key:null,base:[0,0,800,500],cur:null};
const sceneSvg=()=>$('#scene svg');
const sceneKey=()=>UI.cu?'cu:'+UI.cu:UI.zone+(UI.zone==='air'?':'+(G.room||0):'');
function setVB(){const sv=sceneSvg();if(!sv)return;sv.setAttribute('viewBox',(VIEW.cur||VIEW.base).map(n=>+n.toFixed(2)).join(' '));
  const z=!!VIEW.cur;$('#scene').classList.toggle('zoomed',z);$('#bView').hidden=!z}
function applyView(){const sv=sceneSvg();if(!sv)return;const vb=sv.getAttribute('viewBox').split(/[\s,]+/).map(Number);
  const k=sceneKey();if(VIEW.key!==k){VIEW.key=k;VIEW.cur=null}VIEW.base=vb;setVB()}
function clampVB(x,y,w,hh){const b=VIEW.base;w=clamp(w,b[2]/4,b[2]);hh=w*b[3]/b[2];return[clamp(x,b[0],b[0]+b[2]-w),clamp(y,b[1],b[1]+b[3]-hh),w,hh]}
function zoomAround(px,py,factor,from){const c=from||VIEW.cur||VIEW.base,w=c[2]/factor,k=w/c[2];
  const v=clampVB(px-(px-c[0])*k,py-(py-c[1])*k,w,c[3]*k);VIEW.cur=v[2]>=VIEW.base[2]-.5?null:v;setVB()}
function toSvg(cx,cy){const sv=sceneSvg(),m=sv.getScreenCTM();if(!m)return{x:0,y:0};const pt=sv.createSVGPoint();pt.x=cx;pt.y=cy;return pt.matrixTransform(m.inverse())}
(function(){
  const sc=$('#scene'),P=new Map();let pinch=null,drag=null,moved=false,lastTap=null,raf=0,lastPT='mouse';
  const interactive=t=>t.closest('[data-zone],[data-comp],[data-term],button,a');
  const sched=fn=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(fn)};
  sc.addEventListener('pointerdown',e=>{lastPT=e.pointerType;if(e.pointerType==='mouse'&&e.button!==0)return;if(!sceneSvg())return;
    P.set(e.pointerId,{x:e.clientX,y:e.clientY});if(P.size===1)moved=false;
    const cur=(VIEW.cur||VIEW.base).slice();
    if(P.size===2){const [a,b]=[...P.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,vb:cur,mid:toSvg((a.x+b.x)/2,(a.y+b.y)/2)};drag=null;moved=true}
    else if(P.size===1)drag={x:e.clientX,y:e.clientY,vb:cur,id:e.pointerId}});
  sc.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&P.size>=2){const [a,b]=[...P.values()],f=Math.hypot(a.x-b.x,a.y-b.y)/pinch.d;e.preventDefault();sched(()=>zoomAround(pinch.mid.x,pinch.mid.y,f,pinch.vb));return}
    if(drag&&VIEW.cur){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
      if(!moved&&Math.hypot(dx,dy)>8){moved=true;try{sc.setPointerCapture(e.pointerId)}catch(_){}}
      if(moved){e.preventDefault();const s=drag.vb[2]/sc.getBoundingClientRect().width;sched(()=>{VIEW.cur=clampVB(drag.vb[0]-dx*s,drag.vb[1]-dy*s,drag.vb[2],drag.vb[3]);setVB()})}}
    else if(drag&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8)moved=true});
  const end=e=>{if(!P.has(e.pointerId))return;P.delete(e.pointerId);
    if(P.size<2)pinch=null;
    if(P.size===1){const [id,p]=[...P.entries()][0];drag={x:p.x,y:p.y,vb:(VIEW.cur||VIEW.base).slice(),id}}
    if(P.size===0){drag=null;
      if(e.type==='pointerup'&&e.pointerType!=='mouse'&&!moved&&!interactive(e.target)){const now=Date.now();
        if(lastTap&&now-lastTap.t<320&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<34){const p=toSvg(e.clientX,e.clientY);VIEW.cur?(VIEW.cur=null,setVB()):zoomAround(p.x,p.y,2.2);lastTap=null}
        else lastTap={t:now,x:e.clientX,y:e.clientY}}}};
  sc.addEventListener('pointerup',end);sc.addEventListener('pointercancel',end);
  sc.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
  sc.addEventListener('dblclick',e=>{if(lastPT!=='mouse'||interactive(e.target))return;const p=toSvg(e.clientX,e.clientY);VIEW.cur?(VIEW.cur=null,setVB()):zoomAround(p.x,p.y,2.2)});
  sc.addEventListener('wheel',e=>{if(!e.ctrlKey&&!VIEW.cur)return;e.preventDefault();const p=toSvg(e.clientX,e.clientY);zoomAround(p.x,p.y,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0025)))},{passive:false});
  ['gesturestart','gesturechange'].forEach(t=>sc.addEventListener(t,e=>e.preventDefault(),{passive:false}));
  $('#bView').onclick=()=>{VIEW.cur=null;setVB()};
})();
$('#bStats').onclick=openStats;
$('#bHD').onclick=()=>{setHD(!store.hd);save();renderScene()};
setHD(store.hd);
const setHdr=()=>document.documentElement.style.setProperty('--hdr',$('header.top').offsetHeight+'px');
addEventListener('resize',setHdr);addEventListener('orientationchange',()=>setTimeout(setHdr,250));setHdr();
$('#bFlow').onclick=()=>{UI.flow=!UI.flow;if(UI.flow)addLog('Airflow view on.');renderScene()};
$('#bCall').onclick=openCall;
newCall();
</script>
